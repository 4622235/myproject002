<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自定义倒计时</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f1419;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(56, 132, 255, 0.13), transparent 55%),
      radial-gradient(circle at 80% 70%, rgba(0, 200, 160, 0.10), transparent 55%);
    font-family: -apple-system, BlinkMacSystemFont, "Microsoft YaHei", "PingFang SC", sans-serif;
    color: #e8edf4;
    padding: 24px;
    overflow: hidden;
  }
  .card {
    width: 100%;
    max-width: 560px;
    background: rgba(22, 30, 42, 0.78);
    border: 1px solid rgba(120, 160, 220, 0.18);
    border-radius: 24px;
    padding: 36px 32px 30px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(14px);
    text-align: center;
  }
  .label {
    font-size: 15px;
    color: #8b9cb3;
    letter-spacing: 2px;
    margin-bottom: 6px;
  }
  .event-name {
    font-size: 20px;
    color: #dfe9f7;
    font-weight: 600;
    margin-bottom: 16px;
  }
  .days {
    font-size: clamp(72px, 20vw, 136px);
    font-weight: 800;
    line-height: 0.92;
    letter-spacing: -5px;
    background: linear-gradient(160deg, #7ec3ff 0%, #4d9cff 45%, #2f7ae5 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    font-variant-numeric: tabular-nums;
  }
  .unit {
    font-size: 16px;
    color: #8b9cb3;
    letter-spacing: 8px;
    margin-top: 6px;
    margin-bottom: 22px;
  }
  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(120, 160, 220, 0.32), transparent);
    margin: 0 0 18px;
  }
  .clock {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 24px;
  }
  .cell {
    flex: 1;
    background: rgba(12, 18, 26, 0.62);
    border-radius: 11px;
    padding: 12px 6px 10px;
  }
  .cell .num {
    font-size: clamp(20px, 5vw, 28px);
    font-weight: 700;
    color: #dfe9f7;
    font-variant-numeric: tabular-nums;
  }
  .cell .tag {
    font-size: 11px;
    color: #64768d;
    margin-top: 5px;
    letter-spacing: 1.5px;
  }
  /* ===== 设置区 ===== */
  .settings {
    text-align: left;
    background: rgba(12, 18, 26, 0.5);
    border-radius: 14px;
    padding: 16px;
  }
  .settings .row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .settings .row:last-child { margin-bottom: 0; }
  .settings label {
    font-size: 13px;
    color: #8b9cb3;
    white-space: nowrap;
    min-width: 64px;
  }
  .settings input, .settings select {
    flex: 1;
    background: rgba(30, 40, 56, 0.9);
    border: 1px solid rgba(120, 160, 220, 0.25);
    border-radius: 8px;
    color: #e8edf4;
    font-size: 14px;
    padding: 8px 10px;
    font-family: inherit;
    outline: none;
    color-scheme: dark;
  }
  .settings input:focus, .settings select:focus {
    border-color: #4d9cff;
  }
  .btn {
    flex: 1;
    background: linear-gradient(135deg, #3b82d6, #2f6ab8);
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    padding: 9px 0;
    cursor: pointer;
    font-family: inherit;
  }
  .btn:hover { filter: brightness(1.12); }
  .btn.ghost {
    background: transparent;
    border: 1px solid rgba(120, 160, 220, 0.3);
    color: #8b9cb3;
    font-weight: 400;
  }
  .quick {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .quick button {
    flex: 1;
    background: rgba(30, 40, 56, 0.9);
    border: 1px solid rgba(120, 160, 220, 0.25);
    border-radius: 8px;
    color: #9fb2c9;
    font-size: 12.5px;
    padding: 7px 0;
    cursor: pointer;
    font-family: inherit;
  }
  .quick button:hover { border-color: #4d9cff; color: #dfe9f7; }
  .footer {
    margin-top: 20px;
    font-size: 11.5px;
    color: #4e5e72;
    letter-spacing: 1px;
  }
  .done .days {
    background: linear-gradient(160deg, #ffd66e 0%, #ffb02e 100%);
    -webkit-background-clip: text;
    background-clip: text;
  }
  .toggle {
    font-size: 12px;
    color: #64768d;
    cursor: pointer;
    user-select: none;
    margin-top: 14px;
    text-align: center;
  }
  .toggle:hover { color: #8b9cb3; }
  @media (max-width: 420px) {
    .card { padding: 28px 18px 24px; border-radius: 18px; }
  }
</style>
</head>
<body>

<div class="card" id="card">
  <div class="label">倒计时</div>
  <div class="event-name" id="eventName">距离 2027 年</div>
  <div class="days" id="days">--</div>
  <div class="unit">天</div>
  <div class="divider"></div>
  <div class="clock">
    <div class="cell"><div class="num" id="hh">--</div><div class="tag">时</div></div>
    <div class="cell"><div class="num" id="mm">--</div><div class="tag">分</div></div>
    <div class="cell"><div class="num" id="ss">--</div><div class="tag">秒</div></div>
  </div>

  <div class="settings" id="settings">
    <div class="quick">
      <button data-t="2027-01-01T00:00">2027</button>
      <button data-t="2028-01-01T00:00">2028</button>
      <button data-t="2029-01-01T00:00">2029</button>
      <button data-t="2030-01-01T00:00">2030</button>
    </div>
    <div class="row">
      <label>事项名称</label>
      <input type="text" id="nameInput" placeholder="例如：生日、放假、考试" maxlength="20">
    </div>
    <div class="row">
      <label>目标日期</label>
      <input type="datetime-local" id="dateInput">
    </div>
    <div class="row">
      <button class="btn" id="setBtn">开始倒计时</button>
      <button class="btn ghost" id="resetBtn">恢复默认</button>
    </div>
  </div>

  <div class="toggle" id="toggle">▲ 设置（点此收起 / 展开）</div>
  <div class="footer" id="footer">每秒自动刷新 · 自动记住你的设置</div>
</div>

<script>
  const DEFAULT_TARGET = '2027-01-01T00:00';
  const DEFAULT_NAME = '距离 2027 年';
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, '0');

  // ===== 读取上次的设置（存在浏览器里，关掉也不丢） =====
  let target = localStorage.getItem('cd_target') || DEFAULT_TARGET;
  let name = localStorage.getItem('cd_name') || DEFAULT_NAME;

  $('nameInput').value = name === DEFAULT_NAME ? '' : name;
  $('dateInput').value = target;

  // 收起/展开设置区
  let open = true;
  $('toggle').addEventListener('click', () => {
    open = !open;
    $('settings').style.display = open ? '' : 'none';
    $('toggle').textContent = open ? '▲ 设置（点此收起 / 展开）' : '▼ 设置（点此展开修改日期）';
  });

  // 快捷按钮：点一下直接切换年份
  document.querySelectorAll('.quick button').forEach(btn => {
    btn.addEventListener('click', () => {
      target = btn.dataset.t;
      name = '距离 ' + target.slice(0, 4) + ' 年';
      localStorage.setItem('cd_target', target);
      localStorage.setItem('cd_name', name);
      $('dateInput').value = target;
      $('nameInput').value = '';
      applyAndTick();
    });
  });

  // 「开始倒计时」按钮
  $('setBtn').addEventListener('click', () => {
    const d = $('dateInput').value;
    if (!d) { alert('请先选择一个日期'); return; }
    target = d;
    const inputName = $('nameInput').value.trim();
    name = inputName ? ('距离 ' + inputName) : ('距离 ' + d.slice(0, 10));
    localStorage.setItem('cd_target', target);
    localStorage.setItem('cd_name', name);
    applyAndTick();
    // 设置完自动收起
    open = false;
    $('settings').style.display = 'none';
    $('toggle').textContent = '▼ 设置（点此展开修改日期）';
  });

  // 恢复默认
  $('resetBtn').addEventListener('click', () => {
    target = DEFAULT_TARGET;
    name = DEFAULT_NAME;
    localStorage.removeItem('cd_target');
    localStorage.removeItem('cd_name');
    $('dateInput').value = target;
    $('nameInput').value = '';
    applyAndTick();
  });

  function applyAndTick() {
    $('eventName').textContent = name;
    $('footer').textContent = '目标：' + target.replace('T', ' ');
    tick();
  }

  function tick() {
    const t = new Date(target).getTime();
    if (isNaN(t)) { $('days').textContent = '!'; return; }
    const diff = t - Date.now();

    if (diff <= 0) {
      $('days').textContent = '0';
      $('hh').textContent = '00';
      $('mm').textContent = '00';
      $('ss').textContent = '00';
      $('eventName').textContent = name + ' 已到达';
      $('card').classList.add('done');
      return;
    }
    $('card').classList.remove('done');

    const sec = Math.floor(diff / 1000);
    $('days').textContent = Math.floor(sec / 86400);
    $('hh').textContent = pad(Math.floor((sec % 86400) / 3600));
    $('mm').textContent = pad(Math.floor((sec % 3600) / 60));
    $('ss').textContent = pad(sec % 60);
  }

  applyAndTick();
  setInterval(tick, 1000);
</script>

</body>
</html>
