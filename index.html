<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>倒计时 · 粉紫版</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f0e6f2;
    background-image:
      radial-gradient(circle at 18% 25%, rgba(235, 110, 190, 0.16), transparent 55%),
      radial-gradient(circle at 82% 72%, rgba(150, 95, 235, 0.15), transparent 55%),
      radial-gradient(circle at 60% 8%, rgba(250, 160, 220, 0.12), transparent 45%);
    font-family: -apple-system, BlinkMacSystemFont, "Microsoft YaHei", "PingFang SC", sans-serif;
    color: #43304f;
    padding: 24px;
    overflow-y: auto;
  }
  .card {
    width: 100%;
    max-width: 580px;
    background: rgba(255, 250, 254, 0.85);
    border: 1px solid rgba(205, 160, 225, 0.4);
    border-radius: 24px;
    padding: 34px 30px 28px;
    box-shadow: 0 20px 50px rgba(100, 45, 110, 0.18);
    backdrop-filter: blur(14px);
    text-align: center;
    margin: 10px 0;
  }
  .label { font-size: 14px; color: #8a7495; letter-spacing: 3px; margin-bottom: 6px; }
  .event-name { font-size: 21px; color: #a03480; font-weight: 700; margin-bottom: 14px; }
  .days {
    font-size: clamp(68px, 19vw, 130px);
    font-weight: 800;
    line-height: 0.92;
    letter-spacing: -4px;
    background: linear-gradient(160deg, #d94fb0 0%, #a45cf0 50%, #7c4fe0 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    font-variant-numeric: tabular-nums;
  }
  .unit { font-size: 15px; color: #8a7495; letter-spacing: 8px; margin-top: 6px; margin-bottom: 20px; }
  .divider { height: 1px; background: linear-gradient(90deg, transparent, rgba(200, 140, 220, 0.45), transparent); margin: 0 0 16px; }
  .clock { display: flex; justify-content: center; gap: 10px; margin-bottom: 16px; }
  .cell { flex: 1; background: rgba(240, 230, 244, 0.75); border-radius: 11px; padding: 11px 6px 9px; }
  .cell .num { font-size: clamp(19px, 4.6vw, 26px); font-weight: 700; color: #4a3556; font-variant-numeric: tabular-nums; }
  .cell .tag { font-size: 11px; color: #9a86a8; margin-top: 4px; letter-spacing: 2px; }
  /* 日期信息标签 */
  .chips { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; margin-bottom: 18px; }
  .chip { font-size: 12px; padding: 5px 12px; border-radius: 999px; letter-spacing: 0.5px; }
  .chip.pink  { background: rgba(225, 70, 175, 0.12); color: #b8328c; border: 1px solid rgba(225,70,175,0.3); }
  .chip.purple{ background: rgba(140, 85, 235, 0.12); color: #6636bd; border: 1px solid rgba(140,85,235,0.3); }
  .chip.gold  { background: rgba(214, 140, 20, 0.12); color: #9c6a0e; border: 1px solid rgba(214,140,20,0.32); }
  /* 设置区 */
  .settings { text-align: left; background: rgba(244, 234, 248, 0.85); border-radius: 14px; padding: 15px; border: 1px solid rgba(210, 175, 230, 0.35); }
  .settings .row { display: flex; align-items: center; gap: 10px; margin-bottom: 11px; }
  .settings .row:last-child { margin-bottom: 0; }
  .settings label { font-size: 13px; color: #7c6489; white-space: nowrap; min-width: 64px; }
  .settings input {
    flex: 1;
    background: #ffffff;
    border: 1px solid #dcc4e6;
    border-radius: 8px;
    color: #43304f;
    font-size: 14px;
    padding: 8px 10px;
    font-family: inherit;
    outline: none;
    cursor: pointer;
  }
  .settings input:focus { border-color: #d94fb0; }
  .btn {
    flex: 1;
    background: linear-gradient(135deg, #d94fb0, #8b5cf6);
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    padding: 9px 0;
    cursor: pointer;
    font-family: inherit;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn.ghost {
    background: transparent;
    border: 1px solid #d9b8e0;
    color: #8a7495;
    font-weight: 400;
  }
  .hint { font-size: 11px; color: #a08cb0; margin-top: 9px; text-align: center; }
  /* 月历 */
  .cal { background: #ffffff; border: 1px solid #dcc4e6; border-radius: 10px; padding: 10px; margin-bottom: 11px; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; gap: 6px; }
  .cal-head button {
    background: none; border: 1px solid #dcc4e6; border-radius: 6px;
    width: 30px; height: 26px; color: #7c6489; cursor: pointer; font-size: 14px; flex-shrink: 0;
  }
  .cal-head button:hover { border-color: #d94fb0; color: #b8328c; }
  #calTitle { font-size: 13.5px; color: #5c3b52; font-weight: 600; flex: 1; }
  .cal-week { display: grid; grid-template-columns: repeat(7, 1fr); font-size: 10.5px; color: #9a86a8; text-align: center; margin-bottom: 4px; }
  .cal-week span:first-child, .cal-week span:last-child { color: #c76a9e; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal-cell { text-align: center; padding: 3px 0 4px; border-radius: 7px; cursor: pointer; }
  .cal-cell:hover { background: rgba(217, 79, 176, 0.1); }
  .cal-cell.dim { opacity: 0.32; cursor: default; }
  .cal-cell .d { font-size: 13px; font-weight: 600; color: #4a3556; line-height: 1.25; }
  .cal-cell.weekend .d { color: #c23a8c; }
  .cal-cell.today { background: rgba(140, 85, 235, 0.14); }
  .cal-cell.sel { background: rgba(217, 79, 176, 0.14); box-shadow: inset 0 0 0 1.5px #d94fb0; }
  .cal-cell .l { font-size: 9px; color: #9a86a8; line-height: 1.4; white-space: nowrap; overflow: hidden; }
  .cal-cell.fest .l { color: #b07a10; font-weight: 700; }
  .cal-cell.term .l { color: #6636bd; font-weight: 700; }
  /* 实时预览 */
  .preview {
    font-size: 12px; color: #7c6489;
    background: rgba(244, 234, 248, 0.9);
    border: 1px solid rgba(210, 175, 230, 0.4);
    border-radius: 8px; padding: 8px 10px; margin-bottom: 11px;
    text-align: left; line-height: 1.8;
  }
  .preview b { color: #b8328c; }
  /* 已保存列表 */
  .saved-title { font-size: 13px; color: #7c6489; text-align: left; margin: 16px 2px 8px; letter-spacing: 1px; }
  .saved-list { display: flex; flex-direction: column; gap: 7px; }
  .saved-item {
    display: flex; align-items: center; gap: 10px;
    background: rgba(255, 252, 255, 0.8);
    border: 1px solid rgba(210, 170, 230, 0.4);
    border-radius: 10px;
    padding: 9px 12px;
    cursor: pointer;
    text-align: left;
  }
  .saved-item:hover { border-color: #c76ad2; }
  .saved-item.active { border-color: #d94fb0; background: rgba(217, 79, 176, 0.08); }
  .saved-item .s-name { font-size: 14px; color: #5c3b52; font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .saved-item .s-info { font-size: 11.5px; color: #9a86a8; white-space: nowrap; }
  .saved-item .s-del { color: #a08cb0; font-size: 15px; padding: 2px 6px; border-radius: 6px; cursor: pointer; flex-shrink: 0; }
  .saved-item .s-del:hover { color: #c22a76; background: rgba(194, 42, 118, 0.1); }
  .toggle { font-size: 12px; color: #9a86a8; cursor: pointer; user-select: none; margin-top: 14px; text-align: center; }
  .toggle:hover { color: #b8328c; }
  .footer { margin-top: 18px; font-size: 11.5px; color: #a494b0; letter-spacing: 1px; }
  .done .days {
    background: linear-gradient(160deg, #e8a33d 0%, #e07a3d 100%);
    -webkit-background-clip: text;
    background-clip: text;
  }
  @media (max-width: 420px) {
    .card { padding: 26px 16px 22px; border-radius: 18px; }
  }
</style>
</head>
<body>

<div class="card" id="card">
  <div class="label">倒计时</div>
  <div class="event-name" id="eventName">--</div>
  <div class="days" id="days">--</div>
  <div class="unit">天</div>
  <div class="divider"></div>
  <div class="clock">
    <div class="cell"><div class="num" id="hh">--</div><div class="tag">时</div></div>
    <div class="cell"><div class="num" id="mm">--</div><div class="tag">分</div></div>
    <div class="cell"><div class="num" id="ss">--</div><div class="tag">秒</div></div>
  </div>
  <div class="chips" id="chips"></div>

  <div class="settings" id="settings">
    <div class="row">
      <label>事项名称</label>
      <input type="text" id="nameInput" placeholder="例如：生日、放假、考试" maxlength="20">
    </div>
    <div class="row">
      <label>目标日期</label>
      <input type="text" id="dateInput" readonly placeholder="点击选择日期（弹出农历日历）">
    </div>
    <div class="cal" id="calBox" style="display:none">
      <div class="cal-head">
        <button id="calPY" title="上一年">«</button>
        <button id="calPrev" title="上个月">‹</button>
        <div id="calTitle"></div>
        <button id="calNext" title="下个月">›</button>
        <button id="calNY" title="下一年">»</button>
      </div>
      <div class="cal-week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
    <div class="preview" id="preview"></div>
    <div class="row">
      <button class="btn" id="saveBtn">保存并倒计时</button>
      <button class="btn ghost" id="resetBtn">恢复默认</button>
    </div>
    <div class="hint">支持 2024-2046 年的农历、节气与节日显示 · 保存后不用重新输入</div>
  </div>

  <div class="saved-title" id="savedTitle">已保存的倒计时</div>
  <div class="saved-list" id="savedList"></div>

  <div class="toggle" id="toggle">▲ 设置（点此收起 / 展开）</div>
  <div class="footer" id="footer"></div>
</div>

// 默认目标 = 下一个还没过的元旦（元旦当天仍算当年，1月2日起自动跳到明年）
function nextNewYear() {
  const n = new Date();
  const y = (n.getMonth() === 0 && n.getDate() === 1) ? n.getFullYear() : n.getFullYear() + 1;
  return y + '-01-01';
}
let DEFAULT_TARGET = nextNewYear();
let DEFAULT_NAME = '距离 ' + DEFAULT_TARGET.slice(0, 4) + ' 年';
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
// 兼容旧数据（可能带 T00:00），统一成带时刻的格式参与计算
const norm = t => t.includes('T') ? t : t + 'T00:00';
const WEEK = ['日', '一', '二', '三', '四', '五', '六'];
const MNAME = {1:'正月',2:'二月',3:'三月',4:'四月',5:'五月',6:'六月',7:'七月',8:'八月',9:'九月',10:'十月',11:'冬月',12:'腊月'};
const DNAME = ['初一','初二','初三','初四','初五','初六','初七','初八','初九','初十',
               '十一','十二','十三','十四','十五','十六','十七','十八','十九','二十',
               '廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];
const LFEST = {'1-1':'春节','1-15':'元宵节','2-2':'龙抬头','5-5':'端午节','7-7':'七夕节','9-9':'重阳节','12-8':'腊八节'};
const SFEST = {'1-1':'元旦','3-8':'妇女节','5-1':'劳动节','5-4':'青年节','6-1':'儿童节','10-1':'国庆节'};
const STATUTORY = ['元旦','春节','清明节','劳动节','端午节','中秋节','国庆节'];

/* ================= 农历计算 ================= */
function lunarInfo(dateStr) {
  let ly = null;
  for (let y = 2024; y <= 2046; y++) {
    if (dateStr >= LUNAR_YEARS[y].cny) ly = y; else break;
  }
  if (!ly) return null;
  const s = LUNAR_YEARS[ly];
  const days = Math.floor((new Date(dateStr + 'T12:00') - new Date(s.cny + 'T12:00')) / 86400000);
  const order = [];
  for (let m = 1; m <= 12; m++) {
    order.push({ m, leap: false, len: s.len[m - 1] });
    if (s.leap === m) order.push({ m, leap: true, len: s.leaplen });
  }
  let rest = days;
  for (const mo of order) {
    if (rest < mo.len) return { y: ly, m: mo.m, leap: mo.leap, d: rest + 1, gz: s.gz, mlen: mo.len };
    rest -= mo.len;
  }
  return null;
}

function dateInfo(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  const out = { week: '星期' + WEEK[dt.getDay()], lunar: null, term: LUNAR_TERMS[dateStr] || null, fest: [] };
  const L = lunarInfo(dateStr);
  if (L) {
    out.lunar = '农历 ' + L.gz + '年' + (L.leap ? '闰' : '') + MNAME[L.m] + DNAME[L.d - 1];
    if (!L.leap) {
      const f = LFEST[L.m + '-' + L.d];
      if (f) out.fest.push(f);
      if (L.m === 12 && L.d === L.mlen) out.fest.push('除夕');
    }
  }
  const sf = SFEST[m + '-' + d];
  if (sf) out.fest.push(sf);
  if (out.term === '清明') out.fest.push('清明节');
  out.statutory = out.fest.some(f => STATUTORY.includes(f));
  return out;
}

/* ================= 状态 ================= */
let curName = localStorage.getItem('cd_name') || DEFAULT_NAME;
let curTarget = norm(localStorage.getItem('cd_target') || DEFAULT_TARGET);
let saved = [];
try { saved = JSON.parse(localStorage.getItem('cd_saved') || 'null') || []; } catch (e) { saved = []; }
if (!Array.isArray(saved)) saved = [];
if (!saved.length && !localStorage.getItem('cd_saved_seen')) {
  saved = [{ n: DEFAULT_NAME, t: DEFAULT_TARGET }];
  localStorage.setItem('cd_saved', JSON.stringify(saved));
  localStorage.setItem('cd_saved_seen', '1');
}

function persist() {
  localStorage.setItem('cd_name', curName);
  localStorage.setItem('cd_target', curTarget);
  localStorage.setItem('cd_saved', JSON.stringify(saved));
}

/* ================= 界面渲染 ================= */
function renderChips() {
  const box = $('chips');
  box.innerHTML = '';
  const datePart = curTarget.slice(0, 10);
  const info = dateInfo(datePart);
  const chips = [];
  chips.push({ cls: 'pink', text: info.week });
  if (info.lunar) chips.push({ cls: 'purple', text: info.lunar });
  if (info.fest.length) {
    chips.push({ cls: 'gold', text: info.fest.join(' · ') + (info.statutory ? ' · 法定节假日' : '') });
  } else if (info.term) {
    chips.push({ cls: 'purple', text: '节气 · ' + info.term });
  }
  chips.forEach(c => {
    const el = document.createElement('span');
    el.className = 'chip ' + c.cls;
    el.textContent = c.text;
    box.appendChild(el);
  });
}

function dayDiff(target) {
  return Math.floor((new Date(norm(target)).getTime() - Date.now()) / 86400000);
}

function renderSaved() {
  const list = $('savedList');
  list.innerHTML = '';
  $('savedTitle').style.display = saved.length ? '' : 'none';
  saved.slice().sort((a, b) => a.t.localeCompare(b.t)).forEach(item => {
    const row = document.createElement('div');
    row.className = 'saved-item' + (norm(item.t) === curTarget && item.n === curName ? ' active' : '');
    const left = document.createElement('div');
    left.className = 's-name'; left.textContent = item.n;
    const info = document.createElement('div');
    info.className = 's-info';
    const dd = dayDiff(item.t);
    info.textContent = (dd >= 0 ? '剩 ' + dd + ' 天' : '已过') + ' · ' + norm(item.t).slice(5, 10).replace('-', '/');
    const del = document.createElement('span');
    del.className = 's-del'; del.textContent = '×';
    del.title = '删除';
    del.addEventListener('click', e => {
      e.stopPropagation();
      saved = saved.filter(x => x !== item);
      if (norm(item.t) === curTarget) { curName = DEFAULT_NAME; curTarget = norm(DEFAULT_TARGET); }
      persist(); renderSaved(); applyAndTick();
    });
    row.appendChild(left); row.appendChild(info); row.appendChild(del);
    row.addEventListener('click', () => {
      curName = item.n; curTarget = norm(item.t);
      persist(); renderSaved(); applyAndTick();
      $('dateInput').value = curTarget.slice(0, 10);
      $('nameInput').value = item.n === DEFAULT_NAME ? '' : item.n.replace(/^距离 /, '');
      syncCalToInput();
    });
    list.appendChild(row);
  });
}

/* ================= 月历与实时预览 ================= */
let calY, calM;
let calOpen = false;
function setCalOpen(v) {
  calOpen = v;
  $('calBox').style.display = v ? '' : 'none';
}
function clampCal() {
  if (calY < 2024) { calY = 2024; calM = 0; }
  if (calY > 2046) { calY = 2046; calM = 11; }
}
function calStr(y, m, d) { return y + '-' + pad(m + 1) + '-' + pad(d); }
function syncCalToInput() {
  const v = ($('dateInput').value || '').trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(v)) {
    calY = parseInt(v.slice(0, 4));
    calM = parseInt(v.slice(5, 7)) - 1;
  }
  renderCal(); updatePreview();
}
function updatePreview() {
  const v = ($('dateInput').value || '').trim();
  const el = $('preview');
  if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) {
    el.innerHTML = '点击上方日期框，在日历里选一天，这里会实时显示农历和节日';
    return;
  }
  const info = dateInfo(v);
  const head = '<b>' + v.replace(/-/g, '/') + '</b> · ' + info.week +
    (info.lunar ? '<br>' + info.lunar : '');
  let extra = '';
  if (info.fest.length) extra = '节日：' + info.fest.join('、') + (info.statutory ? '（法定节假日）' : '');
  else if (info.term) extra = '节气：' + info.term;
  el.innerHTML = head + (extra ? '<br>' + extra : '');
}
function renderCal() {
  clampCal();
  $('calTitle').textContent = calY + '年' + (calM + 1) + '月';
  const grid = $('calGrid');
  grid.innerHTML = '';
  const startDow = new Date(calY, calM, 1).getDay();
  const dim = new Date(calY, calM + 1, 0).getDate();
  const dimPrev = new Date(calY, calM, 0).getDate();
  const now = new Date();
  const selStr = ($('dateInput').value || '').trim();
  const cells = [];
  for (let i = startDow - 1; i >= 0; i--) cells.push({ d: dimPrev - i, off: -1 });
  for (let d = 1; d <= dim; d++) cells.push({ d, off: 0 });
  let nd = 1;
  while (cells.length % 7 !== 0) cells.push({ d: nd++, off: 1 });

  cells.forEach((c, idx) => {
    const cell = document.createElement('div');
    cell.className = 'cal-cell';
    const dow = idx % 7;
    let dateStr = null, label = '', info = null;
    if (c.off === 0) {
      dateStr = calStr(calY, calM, c.d);
      info = dateInfo(dateStr);
      const L = lunarInfo(dateStr);
      if (info.fest.length) label = info.fest[0];
      else if (info.term) label = info.term;
      else if (L) label = L.d === 1 ? (L.leap ? '闰' : '') + MNAME[L.m] : DNAME[L.d - 1];
    } else {
      label = c.d;
    }
    cell.innerHTML = '<div class="d">' + c.d + '</div><div class="l">' + label + '</div>';
    if (c.off !== 0) { cell.classList.add('dim'); }
    else {
      if (dow === 0 || dow === 6) cell.classList.add('weekend');
      if (info.fest.length) cell.classList.add('fest');
      else if (info.term) cell.classList.add('term');
      if (dateStr === selStr) cell.classList.add('sel');
      if (now.getFullYear() === calY && now.getMonth() === calM && now.getDate() === c.d) cell.classList.add('today');
      cell.addEventListener('click', (ev) => {
        ev.stopPropagation();  // 防止冒泡到 document 触发"点其他地方收起"
        $('dateInput').value = dateStr;
        syncCalToInput();
      });
    }
    grid.appendChild(cell);
  });
}
$('calPY').addEventListener('click', () => { calY--; clampCal(); renderCal(); });
$('calNY').addEventListener('click', () => { calY++; clampCal(); renderCal(); });
$('calPrev').addEventListener('click', () => { calM--; if (calM < 0) { calM = 11; calY--; } clampCal(); renderCal(); });
$('calNext').addEventListener('click', () => { calM++; if (calM > 11) { calM = 0; calY++; } clampCal(); renderCal(); });

// 点日期框弹出农历日历（只有一个日历，不再弹浏览器自带的）
$('dateInput').addEventListener('click', () => setCalOpen(true));
document.addEventListener('click', (e) => {
  if (!calOpen) return;
  if (e.target === $('dateInput') || $('calBox').contains(e.target)) return;
  setCalOpen(false);
});

/* ================= 倒计时 ================= */
function tick() {
  const t = new Date(curTarget).getTime();
  if (isNaN(t)) { $('days').textContent = '!'; return; }
  const diff = t - Date.now();
  if (diff <= 0) {
    $('days').textContent = '0';
    $('hh').textContent = $('mm').textContent = $('ss').textContent = '00';
    $('eventName').textContent = curName + ' 已到达';
    $('card').classList.add('done');
    return;
  }
  $('card').classList.remove('done');
  const sec = Math.floor(diff / 1000);
  $('days').textContent = Math.floor(sec / 86400);
  $('hh').textContent = pad(Math.floor((sec % 86400) / 3600));
  $('mm').textContent = pad(Math.floor((sec % 3600) / 60));
  $('ss').textContent = pad(sec % 60);
}

function applyAndTick() {
  $('eventName').textContent = curName;
  tick();
  renderChips();
  const now = new Date();
  $('footer').textContent = '今天是 ' + (now.getMonth() + 1) + '月' + now.getDate() + '日 星期' +
    WEEK[now.getDay()] + ' · 目标 ' + curTarget.slice(0, 10);
}

/* ================= 事件 ================= */
$('nameInput').value = curName === DEFAULT_NAME ? '' : curName.replace(/^距离 /, '');
$('dateInput').value = curTarget.slice(0, 10);

let open = true;
$('toggle').addEventListener('click', () => {
  open = !open;
  $('settings').style.display = open ? '' : 'none';
  if (!open) setCalOpen(false);
  $('savedTitle').style.display = open ? '' : (saved.length ? '' : 'none');
  $('toggle').textContent = open ? '▲ 设置（点此收起 / 展开）' : '▼ 设置（点此展开修改日期）';
});

$('saveBtn').addEventListener('click', () => {
  const d = ($('dateInput').value || '').trim();
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) { alert('请先点日期框，在日历里选一天'); return; }
  const inputName = $('nameInput').value.trim();
  curTarget = norm(d);
  curName = inputName ? '距离 ' + inputName : '距离 ' + d;
  const exist = saved.find(x => norm(x.t) === curTarget);
  if (exist) exist.n = curName;
  else saved.push({ n: curName, t: curTarget });
  persist();
  renderSaved(); applyAndTick();
  open = false;
  $('settings').style.display = 'none';
  setCalOpen(false);
  $('toggle').textContent = '▼ 设置（点此展开修改日期）';
});

$('resetBtn').addEventListener('click', () => {
  curTarget = norm(DEFAULT_TARGET); curName = DEFAULT_NAME;
  persist();
  $('dateInput').value = curTarget.slice(0, 10);
  $('nameInput').value = '';
  applyAndTick(); renderSaved(); syncCalToInput();
});

applyAndTick();
renderSaved();
calY = parseInt(curTarget.slice(0, 4));
calM = parseInt(curTarget.slice(5, 7)) - 1;
syncCalToInput();
setInterval(tick, 1000);
</script>
