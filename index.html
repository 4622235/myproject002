<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2027 倒计时</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f1419;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(56, 132, 255, 0.13), transparent 55%),
      radial-gradient(circle at 80% 70%, rgba(0, 200, 160, 0.10), transparent 55%);
    font-family: -apple-system, BlinkMacSystemFont, "Microsoft YaHei", "PingFang SC", sans-serif;
    color: #e8edf4;
    padding: 24px;
    overflow: hidden;
  }
  .card {
    width: 100%;
    max-width: 560px;
    background: rgba(22, 30, 42, 0.78);
    border: 1px solid rgba(120, 160, 220, 0.18);
    border-radius: 24px;
    padding: 40px 32px 32px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(14px);
    text-align: center;
    position: relative;
  }
  .year-badge {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    letter-spacing: 4px;
    color: #6f8299;
    font-weight: 600;
  }
  .label {
    font-size: 15px;
    color: #8b9cb3;
    letter-spacing: 2px;
    margin-bottom: 18px;
    margin-top: 22px;
  }
  .days {
    font-size: clamp(76px, 22vw, 148px);
    font-weight: 800;
    line-height: 0.92;
    letter-spacing: -5px;
    background: linear-gradient(160deg, #7ec3ff 0%, #4d9cff 45%, #2f7ae5 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    font-variant-numeric: tabular-nums;
  }
  .unit {
    font-size: 17px;
    color: #8b9cb3;
    letter-spacing: 8px;
    margin-top: 6px;
    margin-bottom: 26px;
  }
  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(120, 160, 220, 0.32), transparent);
    margin: 0 0 22px;
  }
  .target {
    font-size: 15px;
    color: #b7c7dd;
    margin-bottom: 22px;
    letter-spacing: 0.5px;
  }
  .target b { color: #7ec3ff; font-weight: 600; }
  .clock {
    display: flex;
    justify-content: center;
    gap: 10px;
  }
  .cell {
    flex: 1;
    background: rgba(12, 18, 26, 0.62);
    border-radius: 11px;
    padding: 13px 6px 11px;
  }
  .cell .num {
    font-size: clamp(22px, 5.2vw, 31px);
    font-weight: 700;
    color: #dfe9f7;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.5px;
  }
  .cell .tag {
    font-size: 11px;
    color: #64768d;
    margin-top: 5px;
    letter-spacing: 1.5px;
  }
  .progress-wrap { margin-top: 26px; }
  .progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 11.5px;
    color: #64768d;
    margin-bottom: 8px;
    letter-spacing: 0.5px;
  }
  .progress-bar {
    height: 7px;
    background: rgba(12, 18, 26, 0.8);
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    border-radius: 4px;
    background: linear-gradient(90deg, #4d9cff, #33d6b0);
    transition: width 0.6s ease;
  }
  .footer {
    margin-top: 26px;
    font-size: 11.5px;
    color: #4e5e72;
    letter-spacing: 1px;
  }
  .done .days {
    background: linear-gradient(160deg, #ffd66e 0%, #ffb02e 100%);
    -webkit-background-clip: text;
    background-clip: text;
  }
  @media (max-width: 420px) {
    .card { padding: 32px 18px 26px; border-radius: 18px; }
    .label { font-size: 13px; }
    .unit { font-size: 14px; letter-spacing: 6px; }
  }
</style>
</head>
<body>

<div class="card" id="card">
  <div class="year-badge">2027</div>
  <div class="label" id="label">距离 2027 年</div>
  <div class="days" id="days">--</div>
  <div class="unit">天</div>
  <div class="divider"></div>
  <div class="target">目标日期：<b id="targetDate">2027-01-01</b></div>
  <div class="clock">
    <div class="cell"><div class="num" id="hh">--</div><div class="tag">时</div></div>
    <div class="cell"><div class="num" id="mm">--</div><div class="tag">分</div></div>
    <div class="cell"><div class="num" id="ss">--</div><div class="tag">秒</div></div>
  </div>
  <div class="progress-wrap">
    <div class="progress-info">
      <span id="startText">起点</span>
      <span id="pctText">0%</span>
      <span id="endText">终点</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="fill"></div></div>
  </div>
  <div class="footer" id="footer">每秒自动刷新</div>
</div>

<script>
  const TARGET = '2027-01-01T00:00:00';
  const LABEL_TEXT = '距离 2027 年';

  const target = new Date(TARGET).getTime();
  const start  = new Date('2026-01-01T00:00:00').getTime();
  const pad = n => String(n).padStart(2, '0');
  const $ = id => document.getElementById(id);

  $('label').textContent = LABEL_TEXT;
  $('targetDate').textContent = TARGET.slice(0, 10);
  $('startText').textContent = '2026.01.01';
  $('endText').textContent = TARGET.slice(0, 4) + '.' + TARGET.slice(5, 7) + '.' + TARGET.slice(8, 10);

  function tick() {
    const now = Date.now();
    let diff = target - now;

    if (diff <= 0) {
      $('days').textContent = '0';
      $('hh').textContent = '00';
      $('mm').textContent = '00';
      $('ss').textContent = '00';
      $('label').textContent = LABEL_TEXT + ' 已到达';
      $('footer').textContent = '目标日期已到达 🎉';
      $('card').classList.add('done');
      $('fill').style.width = '100%';
      $('pctText').textContent = '100%';
      return;
    }

    const sec = Math.floor(diff / 1000);
    const d = Math.floor(sec / 86400);
    const h = Math.floor((sec % 86400) / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = sec % 60;

    $('days').textContent = d;
    $('hh').textContent = pad(h);
    $('mm').textContent = pad(m);
    $('ss').textContent = pad(s);

    const total = target - start;
    const passed = now - start;
    const pct = Math.min(100, Math.max(0, (passed / total) * 100));
    $('fill').style.width = pct.toFixed(2) + '%';
    $('pctText').textContent = pct.toFixed(1) + '%';
  }

  tick();
  setInterval(tick, 1000);
</script>

</body>
</html>
